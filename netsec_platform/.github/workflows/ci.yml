name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test & Security Scan
    runs-on: ubuntu-latest
    
    services:
      # No external services needed, all tests run locally
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Run Python linter (ruff)
      run: |
        ruff check src/ tests/
        
    - name: Run Python type checker (mypy)
      run: |
        mypy src/ --ignore-missing-imports || true
        
    - name: Run Python formatter check (black)
      run: |
        black --check src/ tests/ || true
        
    - name: Run security scan (bandit)
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        
    - name: Upload bandit report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json
        
    - name: Run secret scan (gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      continue-on-error: true
      
    - name: Run Python tests with coverage
      run: |
        pytest tests/ -v --cov=src/netsec_platform --cov-report=xml --cov-report=html
        
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/
        
    - name: Upload coverage to Codecov (optional)
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: backend
        name: backend-coverage
      if: ${{ secrets.CODECOV_TOKEN != '' }}
      
    - name: Build frontend
      run: |
        cd frontend
        npm run build
        
    - name: Run frontend linter
      run: |
        cd frontend
        npm run lint || true
        
    - name: Run frontend type check
      run: |
        cd frontend
        npm run type-check || true
        
    - name: Archive frontend build
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
    - name: Download bandit report
      uses: actions/download-artifact@v4
      with:
        name: bandit-report
        path: ./
      continue-on-error: true
      
    - name: Check for high severity issues
      run: |
        if [ -f bandit-report.json ]; then
          HIGH_ISSUES=$(cat bandit-report.json | python -c "import sys,json; data=json.load(sys.stdin); print(len([i for i in data.get('results',[]) if i.get('issue_severity','').lower() in ['high','medium']]))" 2>/dev/null || echo "0")
          if [ "$HIGH_ISSUES" -gt 0 ]; then
            echo "⚠️ Found $HIGH_ISSUES medium/high severity security issues"
            exit 1
          else
            echo "✅ No medium/high severity security issues found"
          fi
        else
          echo "⚠️ Bandit report not found"
        fi

  deploy-preview:
    name: Deploy Preview (Optional)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' && false  # Set to true when ready
    # Add deployment steps here (e.g., Vercel, Netlify, AWS S3)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build
        
    - name: Deploy preview placeholder
      run: |
        echo "🚀 Deploy preview would happen here"
        echo "Configure your preferred deployment service (Vercel, Netlify, AWS, etc.)"
